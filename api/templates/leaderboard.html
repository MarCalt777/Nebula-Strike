<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Strike — Līderu Tabula</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/rules" class="btn">📖 Noteikumi un Mehānikas</a>
        </div>

        <h1>🏆 TOP Rezultāti</h1>
        
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Spēlētājs</th>
                    <th>Punkti</th>
                </tr>
            </thead>
            <tbody>
                {% for score in scores %}
                <tr>
                    <td><strong>{{ loop.index }}</strong></td>
                    <td>
                        <!-- Izmantojam score.player, jo mainīgais main.py failā ir "player" -->
                        <a href="/players/{{ score.player }}">{{ score.player }}</a>
                    </td>
                    <td><strong>{{ score.score }}</strong></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
